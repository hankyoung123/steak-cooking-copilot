name: iOS

on:
  push:
    branches: [main]
  pull_request:
  # Manual run. The UI suite walks real cooking flows and takes several
  # minutes, so it is opt-in - see the "suite" input.
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options:
          - unit
          - full
        default: full

jobs:
  test:
    # macOS 15 GitHub-hosted runners ship Xcode 16.3+ (objectVersion 77),
    # the iOS 18.x SDK and matching simulators. The project's
    # LastSwiftUpdateCheck marker (Xcode 26.x) is metadata only and does not
    # require Xcode 26. See docs/asset-audit.md §5.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PROJECT: SteakCopilot.xcodeproj
      SCHEME: SteakCopilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$latest" ]; then
            echo "DEVELOPER_DIR=$latest/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          python3 --version

      # Config/production.yaml is the single source of truth for tunable
      # parameters. Generation is offline (the generator ships its own YAML
      # subset parser — no PyYAML, no pip install).
      - name: Validate tuning configuration
        run: python3 Scripts/generate_tuning.py --self-test

      - name: Regenerate tuning from production.yaml
        run: python3 Scripts/generate_tuning.py

      # The generated Swift is committed, so a stale artifact (or one missing
      # from git) must fail CI instead of silently shipping outdated parameters.
      - name: Fail if generated tuning is stale
        run: |
          set -euo pipefail
          generated="SteakCopilot/Generated/ProductionTuning.generated.swift"
          # `git status --porcelain` also reports untracked files, which
          # `git diff` would miss.
          if [ -n "$(git status --porcelain -- "$generated")" ]; then
            echo "::error::ProductionTuning.generated.swift is out of date with Config/production.yaml."
            echo "Run: python3 Scripts/generate_tuning.py and commit the result."
            git --no-pager diff -- "$generated" || true
            exit 1
          fi
          echo "Generated tuning matches Config/production.yaml."

      - name: Resolve an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available --json | /usr/bin/python3 -c '
          import json, sys

          preferred = [
              "iPhone 16 Pro",
              "iPhone 16",
              "iPhone 15 Pro",
              "iPhone 15",
              "iPhone 14 Pro",
              "iPhone 14",
          ]

          devices = json.load(sys.stdin)["devices"]
          available = []
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      available.append(device)

          if not available:
              sys.exit("No available iPhone simulator found")

          def rank(device):
              name = device["name"]
              for index, candidate in enumerate(preferred):
                  if name == candidate:
                      return (0, index)
              for index, candidate in enumerate(preferred):
                  if name.startswith(candidate + " "):
                      return (1, index)
              return (2, name)

          print(sorted(available, key=rank)[0]["udid"])
          ')
          echo "Using simulator $udid"
          xcrun simctl list devices | grep "$udid" || true
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Push/PR runs the unit suite only: it is ~1 minute and catches the
      # logic, tuning and Swift 6 issues that actually break a change. The UI
      # suite drives the real cook flow and takes several minutes, so it runs
      # when someone asks for it (Actions -> iOS -> Run workflow).
      - name: Build and test
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.suite }}" = "full" ]; then
            echo "Manual run: full suite (unit + UI)."
            scope=""
          else
            echo "Default run: unit tests only."
            echo "The UI suite runs on a manual dispatch (Actions -> iOS -> Run workflow)."
            scope="-only-testing:SteakCopilotTests"
          fi
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            $scope
